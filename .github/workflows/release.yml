name: Release signed F-Droid APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name for the GitHub Release (for example v1.2.3)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Enrich gradle.properties for CI/CD
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-daemon -Dsonar.gradle.skipCompile=true --no-configuration-cache

jobs:
  release:
    name: Build and publish signed APKs
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ format('release-fdroid-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Decode release keystore
        env:
          FIONARO_KEYSTORE_BASE64: ${{ secrets.FIONARO_KEYSTORE_BASE64 }}
          FIONARO_KEYSTORE_PASSWORD: ${{ secrets.FIONARO_KEYSTORE_PASSWORD }}
          FIONARO_KEY_PASSWORD: ${{ secrets.FIONARO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FIONARO_KEYSTORE_BASE64" || { echo "::error::FIONARO_KEYSTORE_BASE64 secret is not set"; exit 1; }
          test -n "$FIONARO_KEYSTORE_PASSWORD" || { echo "::error::FIONARO_KEYSTORE_PASSWORD secret is not set"; exit 1; }
          test -n "$FIONARO_KEY_PASSWORD" || { echo "::error::FIONARO_KEY_PASSWORD secret is not set"; exit 1; }
          umask 077
          echo "$FIONARO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fionaro-release.jks"

      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1

      - name: Build signed F-Droid release APKs
        env:
          FIONARO_KEYSTORE_PATH: ${{ runner.temp }}/fionaro-release.jks
          FIONARO_KEYSTORE_PASSWORD: ${{ secrets.FIONARO_KEYSTORE_PASSWORD }}
          FIONARO_KEY_PASSWORD: ${{ secrets.FIONARO_KEY_PASSWORD }}
        run: ./gradlew assembleFdroidRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          ls -l app/build/outputs/apk/fdroid/release/*.apk
          for apk in app/build/outputs/apk/fdroid/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/fdroid/release/*.apk

name: Main validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions: {}

# Enrich gradle.properties for CI/CD
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx2g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-daemon -Dsonar.gradle.skipCompile=true --no-configuration-cache

jobs:
  validate:
    name: Build F-Droid debug APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ${{ format('main-validation-{0}', github.ref) }}
      cancel-in-progress: true
    steps:
      - name: Checkout with LFS
        uses: nschloe/action-cached-lfs-checkout@385a8ecc719e50b8c71af6ab01a624b486b7c3bc # v1.2.5
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
      - name: Build F-Droid debug APK
        run: ./gradlew assembleFdroidDebug $CI_GRADLE_ARG_PROPERTIES
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest $CI_GRADLE_ARG_PROPERTIES
